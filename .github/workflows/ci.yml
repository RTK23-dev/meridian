name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# onnxruntime-node downloads its CUDA (GPU) binaries from nuget.org during install. The runners have no GPU, and the
# download times out often enough to fail npm ci before any test runs. "skip" leaves out only those non-bundled GPU files;
# the CPU runtime ships inside the npm package (node_modules/onnxruntime-node/script/install.js).
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    # The browser checks run against the production build, served by `npm run preview` (the server the Docker image runs), with a
    # real Postgres. The earlier runs used the Vite dev server, which transforms modules on demand, and its module responses stalled
    # under the baseline's load. A production build needs DATABASE_URL, so the job starts Postgres as a service.
    # The UI baseline captures every route at each width and theme: about 11 minutes locally, and longer on the runner. Its own
    # watchdog (scripts/ui-baseline.mjs) ends a stall first, at 75 minutes, and names the route it stopped on. This limit is the
    # backstop above that, so a stall never holds the job for the six-hour default.
    timeout-minutes: 90
    services:
      postgres:
        # pgvector is needed: migration 0019 creates the vector extension, which the plain postgres image does not include.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://meridian:meridian@127.0.0.1:5432/meridian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the app and migrate its database
        run: npm run build
      - name: Create the app's settings and secrets
        run: npm run setup
      - name: Start the built app for browser smoke
        run: |
          mkdir -p artifacts
          npm run preview -- --host 127.0.0.1 --port 8080 --strictPort > artifacts/preview-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/preview-server.log
          exit 1
      - name: Capture UI baseline
        env:
          UI_BASELINE_DIR: artifacts/ui-baseline
          UI_BASELINE_OUTPUT_ROOT: ${{ github.workspace }}
        run: npm run ui:baseline
      - name: Run browser smoke
        run: |
          BROWSER_SMOKE_OUTPUT_ROOT="$GITHUB_WORKSPACE" \
            node scripts/browser-smoke.mjs http://127.0.0.1:8080/ "$GITHUB_WORKSPACE/artifacts/ui-smoke.png"
      - name: Start the dev server for the design-system check
        # The design system page is a development-only route: src/routes/[_design].tsx answers 404 in a production build. This one check
        # therefore runs against the Vite dev server on its own port, and the preview above keeps serving the production build. The
        # server is pre-bundled first, as a cold dev server answers before its optimizer has finished.
        run: |
          npx vite optimize
          npm run dev -- --port 8081 --strictPort > artifacts/dev-server.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8081/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/dev-server.log
          exit 1
      - name: Check design system accessibility
        run: node scripts/design-system-smoke.mjs http://127.0.0.1:8081/_design
      - name: Check the public pages in a browser
        run: node scripts/public-site-smoke.mjs http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-screenshots
          path: artifacts/
          if-no-files-found: ignore

  # The test suite in six shards that run in parallel. scripts/test-shard.mjs gives each shard its own files, and it fails the
  # shard if the split would skip a test file. The shard count is the size of this matrix (strategy.job-total), so the matrix
  # and the split cannot disagree. scripts/test-shard.test.mjs checks that the shard indexes run from 0 to n-1.
  tests:
    name: tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The video engine's media tests run real ffmpeg and ffprobe on generated clips (src/engine/media).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run this shard of the tests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
          # A missing ffmpeg fails the run instead of skipping the media tests.
          MERIDIAN_REQUIRE_FFMPEG: "1"
        run: |
          set -euo pipefail
          node scripts/test-shard.mjs --group scripts --index "$SHARD_INDEX" --count "$SHARD_COUNT" > "$RUNNER_TEMP/scripts-tests.txt"
          node scripts/test-shard.mjs --group src --index "$SHARD_INDEX" --count "$SHARD_COUNT" > "$RUNNER_TEMP/src-tests.txt"
          mapfile -t scripts_tests < "$RUNNER_TEMP/scripts-tests.txt"
          mapfile -t src_tests < "$RUNNER_TEMP/src-tests.txt"
          # With no file arguments, node --test searches the whole repository, so an empty list must stop the step here.
          if [ "${#scripts_tests[@]}" -eq 0 ] || [ "${#src_tests[@]}" -eq 0 ]; then
            echo "Shard $SHARD_INDEX has no test files." >&2
            exit 1
          fi
          # The same two commands as `npm test`, each given only this shard's files.
          NODE_ENV=development node --test "${scripts_tests[@]}"
          NODE_ENV=development node --experimental-strip-types --test "${src_tests[@]}"

  # Typecheck, lint and build run beside the test shards, so the slowest path is the longer of the two, not their sum.
  static:
    name: typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # The gate that e2e waits on. It passes only when every test shard and the static checks pass. It keeps the name `check`,
  # which docs/TESTING.md names as the job that decides whether code can merge.
  check:
    needs: [tests, static, sidecar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard, the static checks and the sidecar tests to pass
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          SIDECAR_RESULT: ${{ needs.sidecar.result }}
        run: |
          echo "tests: $TESTS_RESULT; typecheck, lint and build: $STATIC_RESULT; sidecar: $SIDECAR_RESULT"
          test "$TESTS_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$SIDECAR_RESULT" = success

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The sourcing sidecar's own tests. They need its Python requirements and make no outbound calls.
      - run: python -m pip install -r sidecar/sourcing/requirements.txt
      - run: python -m unittest discover -s sidecar/sourcing -p "test_*.py"

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the local app for product-loop e2e
        # The product loop exercises the placeholder image provider, which is isolated to TestingRuntime.
        env:
          MERIDIAN_TESTING_RUNTIME: "true"
        run: |
          mkdir -p artifacts/e2e
          # Pre-bundle first, for the same reason as the browser smoke job: the product loop must not start on a half-built server.
          npx vite optimize
          npm run dev > artifacts/e2e/dev-server.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat artifacts/e2e/dev-server.log
              exit 1
            fi
            sleep 1
          done
          cat artifacts/e2e/dev-server.log
          exit 1
      - name: Run full product-loop e2e
        run: npm run e2e
        env:
          PRODUCT_BASE_URL: http://127.0.0.1:8080
          E2E_ARTIFACT_DIR: artifacts/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: product-loop-e2e-failure
          path: artifacts/e2e/
          if-no-files-found: ignore
