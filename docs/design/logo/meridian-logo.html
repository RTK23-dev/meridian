<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Meridian globe mark: motion prototype</title>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "light" ? "light" : "dark";</script>
<style>
  :root { color-scheme: dark; }
  html[data-theme="light"] { color-scheme: light; }
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
  html[data-theme="light"], html[data-theme="light"] body { background: #fff; color: #0a0a0a; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 16px; box-sizing: border-box; }
  canvas { display: block; width: min(88vmin, 720px); aspect-ratio: 1 / 1; }
  .controls { display: flex; align-items: center; gap: 12px; width: min(88vmin, 720px); }
  button { min-height: 44px; min-width: 96px; padding: 0 14px; border: 1px solid #6b6b6b; border-radius: 2px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid #ff2e38; outline-offset: 2px; }
  input[type="range"] { flex: 1; min-height: 44px; accent-color: #ff2e38; }
  output { min-width: 26ch; font-variant-numeric: tabular-nums; color: #949494; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <canvas id="mark" role="img" aria-label="Meridian globe. The globe turns while a red meridian chops down its front, rolls forward into a ring, tips to the side and rolls back."></canvas>
  <div class="controls">
    <button id="toggle" type="button" aria-pressed="false">Pause</button>
    <label for="scrub" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Freeze at t, in seconds</label>
    <input id="scrub" type="range" min="0" max="4" step="0.01" value="0">
    <output id="readout" for="scrub"></output>
  </div>
</main>
<script>
"use strict";

// ---- TUNE HERE. Times are in seconds. Angles are in degrees. ----
// The loop is four moves. The globe turns under the line the whole time; the line itself only moves in the four moves below.
const CONFIG = {
  segmentSeconds: 0.9,          // Each move takes this long. The loop is four moves.
  spinDegPerLoop: 360,          // The globe turns this far per loop. A whole turn keeps the loop joining.
  turnDeg: [0, 90, 90, 90],     // Turn about the vertical axis at each key: 0 is edge-on (the chop), 90 is flat (the ring).
  rollDeg: [0, 0, 90, 0],       // Roll about the horizontal axis at each key: 90 tips the ring to the side view.
  easeMove: [0.65, 0, 0.35, 1], // cubic-bezier for every move, so each one starts and ends softly.
  chopAt: 0.12,                 // When the head plunges down the front, in seconds from t = 0.
  chopBoost: 2.6,               // How much faster the head moves during the plunge. 1 means no change.
  chopWidthSeconds: 0.12,       // How long the plunge lasts, either side of chopAt.
  headStartDeg: 90,             // Where the head starts on the blade's circle at t = 0.
  tiltDeg: 14,                  // The globe is seen this far above its equator.
  arcMinDeg: 180,               // Arc length when the blade is edge-on: exactly the front half, pole to pole.
  arcMaxDeg: 300,               // Arc length when the blade is a flat ring. It changes only while the blade moves.
  latitudesDeg: [-45, 0, 45],   // Grid latitudes.
  meridianCircles: 4,           // Great circles through the poles: 4 means one every 45 degrees.
  arcRadius: 1.03,              // The blade sits just above the surface (1 is the surface).
  arcFarAlpha: 0.22,            // Far side of the blade, as a fraction of its near-side strength. 0 hides it.
  arcSamples: 200,
  glowWidths: [2.6, 1.7],       // Glow passes under the blade, as multiples of its width, outermost first.
  glowAlpha: 0.10,              // Strength of each glow pass.
  gridStrokeDiv: 62,            // Grid line width = mark size / this.
  armStrokeDiv: 30,             // Head width of the blade = mark size / this.
  armTailRatio: 0.8,            // The tail is this fraction of the head's width.
  headDotDiv: 40,               // Radius of the head dot = mark size / this.
  colours: {
    dark: { bg: "#000000", line: "255,255,255", arc: "255,46,56", core: "255,255,255" },
    light: { bg: "#ffffff", line: "10,10,10", arc: "200,16,46", core: "255,214,220" },
  },
};

// ---- Derived timing. Nothing here needs editing. ----
const DEG = Math.PI / 180;
const MOVE = CONFIG.segmentSeconds;
const LOOP = 4 * MOVE;
const TILT = CONFIG.tiltDeg * DEG;
const VIEW = [0, Math.sin(TILT), Math.cos(TILT)]; // Unit vector toward the viewer. y is the polar axis.
const UP = [0, Math.cos(TILT), -Math.sin(TILT)];  // Screen up. Screen right is the globe's x axis.
const MOVE_NAMES = ["chop and forward roll", "sideways roll", "roll back", "return to the chop"];

function easeOf([x1, y1, x2, y2]) {
  const point = (s, p1, p2) => 3 * (1 - s) * (1 - s) * s * p1 + 3 * (1 - s) * s * s * p2 + s * s * s;
  return (x) => {
    let lo = 0;
    let hi = 1;
    for (let i = 0; i < 50; i++) {
      const mid = (lo + hi) / 2;
      if (point(mid, x1, x2) < x) lo = mid; else hi = mid;
    }
    return point((lo + hi) / 2, y1, y2);
  };
}
const ease = easeOf(CONFIG.easeMove);

const wrapTime = (t) => ((t % LOOP) + LOOP) % LOOP;

// The blade's turn and roll at time t. Each move runs from one key to the next, so the last key meets the first at the loop's end.
function anglesAt(t) {
  const x = t / MOVE;
  const index = Math.floor(x) % 4;
  const e = ease(x - Math.floor(x));
  const next = (index + 1) % 4;
  const lerp = (values) => values[index] + (values[next] - values[index]) * e;
  return { turn: lerp(CONFIG.turnDeg), roll: lerp(CONFIG.rollDeg), move: MOVE_NAMES[index] };
}

// The head moves at one full turn per loop, faster for the plunge. The speed profile is integrated once, so the head is continuous.
const SAMPLES = 4000;
function speedAt(t) {
  const gap = Math.abs(t - CONFIG.chopAt);
  const distance = Math.min(gap, LOOP - gap);
  return 1 + (CONFIG.chopBoost - 1) * Math.exp(-((distance / CONFIG.chopWidthSeconds) ** 2));
}
const CUMULATIVE = (() => {
  const out = [0];
  for (let i = 1; i <= SAMPLES; i++) {
    const t0 = (LOOP * (i - 1)) / SAMPLES;
    const t1 = (LOOP * i) / SAMPLES;
    out.push(out[i - 1] + ((speedAt(t0) + speedAt(t1)) / 2) * (t1 - t0));
  }
  return out;
})();
function headAt(t) {
  const x = (t / LOOP) * SAMPLES;
  const i = Math.min(SAMPLES - 1, Math.floor(x));
  const along = CUMULATIVE[i] + (CUMULATIVE[i + 1] - CUMULATIVE[i]) * (x - i);
  return CONFIG.headStartDeg + (360 * along) / CUMULATIVE[SAMPLES];
}

// Rotations. turn is about the vertical axis; roll is about the horizontal axis. Both are applied to the blade and to nothing else.
function turnPoint(deg, p) {
  const c = Math.cos(deg * DEG);
  const s = Math.sin(deg * DEG);
  return [p[0] * c - p[2] * s, p[1], p[0] * s + p[2] * c];
}
function rollPoint(deg, p) {
  const c = Math.cos(deg * DEG);
  const s = Math.sin(deg * DEG);
  return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c];
}
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const project = (p) => ({ x: p[0], y: dot(p, UP), z: dot(p, VIEW) }); // Orthographic: x right, y up, z toward the viewer.
const seen = (p) => p.z >= 0 || Math.hypot(p.x, p.y) >= 1; // The globe hides its far side, except just past the limb.

/** Pure: the drawn state at time t. The same t always gives the same result. */
function frame(time) {
  const t = wrapTime(time);
  const { turn, roll, move } = anglesAt(t);
  const blade = (p) => rollPoint(roll, turnPoint(turn, p));
  const u = blade([0, 1, 0]); // The poles' direction within the blade's plane.
  const v = blade([0, 0, 1]); // The front of the globe within the blade's plane.
  const normal = blade([1, 0, 0]);
  const head = headAt(t);
  const length = CONFIG.arcMinDeg + (CONFIG.arcMaxDeg - CONFIG.arcMinDeg) * Math.abs(normal[2]); // Longer as the blade turns flat.
  const tail = head - length;
  const arc = [];
  for (let i = 0; i <= CONFIG.arcSamples; i++) {
    const psi = (tail + ((head - tail) * i) / CONFIG.arcSamples) * DEG;
    const c = Math.cos(psi);
    const s = Math.sin(psi);
    arc.push(project([0, 1, 2].map((k) => CONFIG.arcRadius * (c * u[k] + s * v[k]))));
  }
  const spin = CONFIG.spinDegPerLoop * (t / LOOP);
  return { t, move, turnDeg: turn, rollDeg: roll, headDeg: head, tailDeg: tail, spinDeg: spin, arc };
}

// Grid lines on the surface, as lists of 3D points. The globe turns them each frame.
const GRID = (() => {
  const lines = [];
  const N = 120;
  for (const latitude of CONFIG.latitudesDeg) {
    const phi = latitude * DEG;
    lines.push(Array.from({ length: N + 1 }, (_, i) => { const a = (2 * Math.PI * i) / N; return [Math.cos(phi) * Math.cos(a), Math.sin(phi), Math.cos(phi) * Math.sin(a)]; }));
  }
  for (let m = 0; m < CONFIG.meridianCircles; m++) {
    const lambda = (Math.PI * m) / CONFIG.meridianCircles;
    lines.push(Array.from({ length: N + 1 }, (_, i) => { const a = (2 * Math.PI * i) / N; return [Math.sin(a) * Math.cos(lambda), Math.cos(a), -Math.sin(a) * Math.sin(lambda)]; }));
  }
  return lines;
})();

// ---- Drawing and playback ----
const params = new URLSearchParams(location.search);
const theme = params.get("theme") === "light" ? "light" : "dark";
const colours = CONFIG.colours[theme];
const canvas = document.getElementById("mark");
const toggle = document.getElementById("toggle");
const scrub = document.getElementById("scrub");
const readout = document.getElementById("readout");
const reduceQuery = matchMedia("(prefers-reduced-motion: reduce)");
const state = { t: 0, playing: false, last: 0, raf: 0, size: 0, dpr: 1 };
scrub.max = String(LOOP);

function resize() {
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);
  state.size = canvas.clientWidth;
  canvas.width = Math.round(state.size * state.dpr);
  canvas.height = canvas.width;
}

function draw(f) {
  const ctx = canvas.getContext("2d");
  const S = state.size;
  const R = S * 0.36;
  const cx = S / 2;
  const cy = S / 2;
  const X = (p) => cx + R * p.x;
  const Y = (p) => cy - R * p.y;
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  ctx.fillStyle = colours.bg;
  ctx.fillRect(0, 0, S, S);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // The globe's rim, then its grid, turned by the spin. Only the near side of the grid is drawn.
  const gridWidth = S / CONFIG.gridStrokeDiv;
  ctx.lineWidth = gridWidth;
  ctx.strokeStyle = `rgba(${colours.line},1)`;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, 2 * Math.PI);
  ctx.stroke();
  const spin = f.spinDeg * DEG;
  const turnGrid = (p) => [p[0] * Math.cos(spin) - p[2] * Math.sin(spin), p[1], p[0] * Math.sin(spin) + p[2] * Math.cos(spin)];
  for (const points of GRID) {
    const projected = points.map((p) => project(turnGrid(p)));
    for (let i = 0; i < projected.length - 1; i++) {
      const a = projected[i];
      const b = projected[i + 1];
      if (a.z + b.z < 0) continue;
      ctx.beginPath();
      ctx.moveTo(X(a), Y(a));
      ctx.lineTo(X(b), Y(b));
      ctx.strokeStyle = `rgba(${colours.line},1)`;
      ctx.lineWidth = gridWidth;
      ctx.stroke();
    }
  }

  // The blade: a glow under it, then the red stroke, tapered from the tail to the head, then a white core along the head half.
  const n = f.arc.length - 1;
  const armWidth = S / CONFIG.armStrokeDiv;
  const segmentWidth = (k) => armWidth * (CONFIG.armTailRatio + (1 - CONFIG.armTailRatio) * k);
  ctx.strokeStyle = `rgb(${colours.arc})`;
  for (const multiple of CONFIG.glowWidths) {
    for (let i = 0; i < n; i++) {
      const a = f.arc[i];
      const b = f.arc[i + 1];
      const k = (i + 1) / n;
      ctx.globalAlpha = CONFIG.glowAlpha * k * (seen(a) && seen(b) ? 1 : CONFIG.arcFarAlpha);
      ctx.lineWidth = segmentWidth(k) * multiple;
      ctx.beginPath();
      ctx.moveTo(X(a), Y(a));
      ctx.lineTo(X(b), Y(b));
      ctx.stroke();
    }
  }
  for (let i = 0; i < n; i++) {
    const a = f.arc[i];
    const b = f.arc[i + 1];
    const k = (i + 1) / n;
    ctx.globalAlpha = (0.18 + 0.82 * Math.pow(k, 0.9)) * (seen(a) && seen(b) ? 1 : CONFIG.arcFarAlpha);
    ctx.lineWidth = segmentWidth(k);
    ctx.beginPath();
    ctx.moveTo(X(a), Y(a));
    ctx.lineTo(X(b), Y(b));
    ctx.stroke();
  }
  ctx.strokeStyle = `rgb(${colours.core})`;
  for (let i = Math.floor(n / 2); i < n; i++) {
    const a = f.arc[i];
    const b = f.arc[i + 1];
    const k = (i + 1) / n;
    ctx.globalAlpha = 0.6 * k * (seen(a) && seen(b) ? 1 : 0);
    ctx.lineWidth = segmentWidth(k) * 0.28;
    ctx.beginPath();
    ctx.moveTo(X(a), Y(a));
    ctx.lineTo(X(b), Y(b));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const head = f.arc[n];
  if (seen(head)) {
    ctx.fillStyle = `rgb(${colours.arc})`;
    ctx.beginPath();
    ctx.arc(X(head), Y(head), S / CONFIG.headDotDiv, 0, 2 * Math.PI);
    ctx.fill();
  }
}

function render() {
  const f = frame(state.t);
  draw(f);
  scrub.value = String(f.t.toFixed(2));
  readout.textContent = `t ${f.t.toFixed(2)} s of ${LOOP.toFixed(2)} | ${f.move} | roll ${f.rollDeg.toFixed(0)} deg`;
}

function setButton() {
  const playing = state.playing;
  toggle.textContent = playing ? "Pause" : "Play";
  toggle.setAttribute("aria-pressed", String(playing));
}

function loop(now) {
  if (!state.playing) return;
  state.t = wrapTime(state.t + Math.min(now - state.last, 100) / 1000); // Capped, so a hidden tab does not jump.
  state.last = now;
  render();
  state.raf = requestAnimationFrame(loop);
}

function play() {
  if (state.playing || reduceQuery.matches) return;
  state.playing = true;
  state.last = performance.now();
  state.raf = requestAnimationFrame(loop);
  setButton();
}

function pause() {
  state.playing = false;
  cancelAnimationFrame(state.raf);
  setButton();
}

// ---- Start-up: ?theme=light, ?t=<seconds> freezes at a time for review. Reduced motion draws one still frame at t = 0. ----
const requested = Number(params.get("t"));
if (params.has("t") && Number.isFinite(requested)) state.t = wrapTime(requested);
resize();
render();
if (!params.has("t") && !reduceQuery.matches) play();
setButton();
if (reduceQuery.matches) toggle.hidden = true;

toggle.addEventListener("click", () => (state.playing ? pause() : play()));
scrub.addEventListener("input", () => { pause(); state.t = Number(scrub.value); render(); });
addEventListener("resize", () => { resize(); render(); });
addEventListener("keydown", (event) => {
  if (event.code === "Space" && event.target === document.body) { event.preventDefault(); state.playing ? pause() : play(); }
});
reduceQuery.addEventListener("change", () => {
  if (reduceQuery.matches) { pause(); toggle.hidden = true; } else { toggle.hidden = false; }
});

// Hook for review and automated capture: window.meridianMark.setTime(seconds) freezes the frame at that time.
window.meridianMark = {
  frame,
  loopSeconds: LOOP,
  setTime(seconds) { pause(); state.t = wrapTime(Number(seconds)); render(); },
};
</script>
</body>
</html>
