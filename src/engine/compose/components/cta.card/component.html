<!DOCTYPE html>
<html data-composition-variables='[{"id":"text","type":"string","label":"Call to action","default":"Follow for more"},{"id":"keyword","type":"string","label":"DM keyword","default":""},{"id":"arrow","type":"enum","label":"Arrow","default":"down","options":[{"value":"down","label":"Down"},{"value":"up","label":"Up"},{"value":"right","label":"Right"},{"value":"none","label":"None"}]},{"id":"durationMs","type":"number","label":"Duration (ms)","default":1000,"min":1,"max":60000,"step":1,"unit":"ms"}]'>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
</head>
<body>
<div data-composition-id="cta.card" data-width="1080" data-height="1920">
  <div class="cc-card">
    <div class="cc-text"></div>
    <div class="cc-keyword"></div>
    <svg class="cc-arrow" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 8 L50 84 M22 58 L50 88 L78 58" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
  <style>
    .cc-card {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 6%;
      border-radius: 48px;
      background: var(--kit-primary);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.22);
      color: var(--kit-background);
      text-align: center;
      opacity: 0;
    }
    .cc-text {
      font-family: var(--kit-font-body), sans-serif;
      font-weight: 700;
      font-size: 64px;
      line-height: 1.2;
      color: var(--kit-background);
    }
    .cc-keyword {
      margin-top: 4%;
      display: none;
      padding: 14px 44px;
      border-radius: 28px;
      background: var(--kit-accent);
      font-family: var(--kit-font-display), sans-serif;
      font-weight: 800;
      font-size: 128px;
      line-height: 1.1;
      color: var(--kit-primary);
      text-transform: uppercase;
    }
    .cc-keyword-on { display: inline-block; }
    .cc-arrow {
      margin-top: 5%;
      width: 18%;
      height: auto;
      display: none;
      stroke: var(--kit-accent);
      overflow: visible;
    }
    .cc-arrow-on { display: block; }
    .cc-arrow-up { transform: rotate(180deg); }
    .cc-arrow-right { transform: rotate(-90deg); }
  </style>
  <script>
    (function () {
      var vars = window.__hyperframes.getVariables();
      var kit = getComputedStyle(document.documentElement);
      var motion = parseFloat(kit.getPropertyValue("--kit-motion")) || 0;
      var card = document.querySelector(".cc-card");
      var textEl = document.querySelector(".cc-text");
      var keywordEl = document.querySelector(".cc-keyword");
      var arrowEl = document.querySelector(".cc-arrow");
      var seconds = vars.durationMs / 1000;
      textEl.textContent = String(vars.text || "");
      if (typeof vars.keyword === "string" && vars.keyword.length > 0) {
        keywordEl.textContent = vars.keyword;
        keywordEl.className = "cc-keyword cc-keyword-on";
      }
      if (vars.arrow !== "none") {
        arrowEl.setAttribute("class", "cc-arrow cc-arrow-on cc-arrow-" + vars.arrow);
      }
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(card, { scale: 1 - 0.12 * motion, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" }, 0);
      if (keywordEl.className.indexOf("cc-keyword-on") !== -1) {
        tl.fromTo(keywordEl, { scale: 1 - 0.2 * motion, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" }, 0.25);
      }
      if (vars.arrow !== "none") {
        var cycles = Math.max(0, Math.floor((seconds - 0.5) / 0.6) - 1);
        tl.fromTo(arrowEl, { y: 0 }, { y: 16 * motion, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: cycles }, 0.5);
      }
      tl.set({}, {}, seconds);
      window.__timelines["cta.card"] = tl;
    })();
  </script>
</div>
</body>
</html>
