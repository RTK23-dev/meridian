<!DOCTYPE html>
<html data-composition-variables='[{"id":"value","type":"number","label":"Value","default":414,"min":0,"max":1000000000,"step":1},{"id":"label","type":"string","label":"Label","default":"Cars counted"},{"id":"decimals","type":"number","label":"Decimals","default":0,"min":0,"max":2,"step":1},{"id":"prefix","type":"string","label":"Prefix","default":""},{"id":"suffix","type":"string","label":"Suffix","default":""},{"id":"durationMs","type":"number","label":"Duration (ms)","default":2000,"min":1,"max":60000,"step":1,"unit":"ms"}]'>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="../lib/motion-kit.js"></script>
</head>
<body>
<div data-composition-id="stat.counter" data-width="1080" data-height="1920">
  <div class="sc-wrap">
    <div class="sc-number"></div>
    <div class="sc-pill"></div>
  </div>
  <style>
    .sc-wrap {
      position: absolute;
      left: 0;
      top: 30%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
    }
    .sc-number {
      font-family: var(--kit-font-display), sans-serif;
      font-weight: 800;
      font-size: 220px;
      line-height: 1;
      letter-spacing: -2px;
      color: var(--kit-accent);
      text-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .sc-pill {
      margin-top: 18px;
      padding: 10px 30px;
      border-radius: 999px;
      background: var(--kit-primary);
      font-family: var(--kit-font-body), sans-serif;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--kit-background);
    }
  </style>
  <script>
    (function () {
      var vars = window.__hyperframes.getVariables();
      var kit = getComputedStyle(document.documentElement);
      var motion = parseFloat(kit.getPropertyValue("--kit-motion")) || 0;
      var wrap = document.querySelector(".sc-wrap");
      var numberEl = document.querySelector(".sc-number");
      var pillEl = document.querySelector(".sc-pill");
      var seconds = vars.durationMs / 1000;
      var decimals = Math.max(0, Math.min(2, Math.round(Number(vars.decimals) || 0)));
      var prefix = typeof vars.prefix === "string" ? vars.prefix : "";
      var suffix = typeof vars.suffix === "string" ? vars.suffix : "";
      var target = Number(vars.value) || 0;
      pillEl.textContent = String(vars.label || "");
      var counter = { n: 0 };
      function show() {
        numberEl.textContent = prefix + counter.n.toFixed(decimals) + suffix;
      }
      show();
      var tl = gsap.timeline({ paused: true });
      var MK = window.MotionKit;
      // Motion kit: the number is there from the first frame and settles on a spring; the count arrives at speed and lands softly.
      var land = MK.spring({ response: 0.3, damping: 0.82 });
      gsap.set(wrap, { autoAlpha: 1 });
      tl.fromTo(wrap, { scale: 1 - 0.1 * motion }, { scale: 1, duration: land.duration, ease: land.ease }, 0);
      tl.to(counter, { n: target, duration: Math.max(0.2, Math.min(1.2, seconds * 0.5)), ease: MK.curve("kit.land"), onUpdate: show }, MK.react(2));
      tl.set({}, {}, seconds);
      window.__timelines["stat.counter"] = tl;
    })();
  </script>
</div>
</body>
</html>
