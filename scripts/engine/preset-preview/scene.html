<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!--
  The preset preview page: an original 3D explainer drawn with WebGL shaders (the 3D scenes) and DOM overlays (titles, counters,
  pills, panels, captions). It loads nothing from the network. render.ts injects window.PRESET (the style preset) and window.SHOW
  (the shot list and the script) and then calls renderAt(seconds) once per frame. Every frame is a pure function of the time.
-->
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; background: #000; }
  #gl { position: absolute; inset: 0; width: 720px; height: 1280px; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #title { position: absolute; left: 44px; top: 96px; width: 640px; font-family: var(--kit-font-display); font-weight: 800;
    font-size: 50px; line-height: 1.06; color: var(--kit-text); letter-spacing: -0.5px; text-shadow: 0 4px 22px rgba(0,0,0,.45); }
  #title .accent { font-family: "FreeSerif", "DejaVu Serif", serif; font-style: italic; font-weight: 700; color: var(--kit-accent);
    letter-spacing: 0; }
  #counter { position: absolute; left: 0; width: 720px; top: 256px; text-align: center; color: var(--kit-text); }
  #counter .num { font-family: var(--kit-font-display); font-weight: 800; font-size: 66px; line-height: 1; letter-spacing: -1px;
    text-shadow: 0 4px 22px rgba(0,0,0,.5); }
  .pill { display: inline-block; margin-top: 8px; padding: 5px 14px; border-radius: 999px; background: rgba(72,80,88,.88);
    font-family: var(--kit-font-body); font-weight: 700; font-size: 15px; letter-spacing: 2.2px; color: #e6eef2; }
  #place { position: absolute; left: 0; width: 720px; top: 150px; text-align: center; }
  #captions { position: absolute; left: 40px; width: 640px; top: 918px; text-align: center; font-family: var(--kit-font-captions);
    font-weight: var(--kit-caption-weight); font-size: 34px; line-height: 1.3; color: var(--kit-text);
    text-shadow: 0 3px 16px rgba(0,0,0,.6); }
  #captions span { padding: 0 6px; border-radius: 7px; }
  #captions span.now { background: var(--kit-caption-highlight); color: #121212; text-shadow: none; }
  #captions span.next { opacity: .45; }
  #room { position: absolute; inset: 0; perspective: 1300px; perspective-origin: 50% 40%; }
  #roomInner { position: absolute; inset: 0; transform-style: preserve-3d; }
  .panel { position: absolute; left: 40px; width: 640px; background: rgba(8,14,28,.94); border: 1px solid rgba(140,190,210,.16);
    box-shadow: 0 30px 80px rgba(0,0,0,.6); color: var(--kit-text); font-family: var(--kit-font-body); }
  .panel .head { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 24px 6px; }
  .panel .head b { font-weight: 800; font-size: 25px; letter-spacing: .4px; }
  .panel .head i { font-style: normal; font-weight: 700; font-size: 13px; letter-spacing: 1.6px; color: #9fb2bd; }
  .panel canvas { display: block; margin: 6px 24px 20px; }
  .big { font-family: var(--kit-font-display); font-weight: 800; color: var(--kit-accent); text-align: center; line-height: 1; }
  .big small { display: block; font-size: 17px; letter-spacing: 3px; color: var(--kit-text); margin-top: 8px; font-weight: 700; }
  #tiles { display: flex; gap: 14px; padding: 6px 24px 22px; }
  #tiles img { width: 190px; height: 190px; object-fit: cover; border: 1px solid rgba(255,255,255,.15); }
  #follow { position: absolute; left: 0; width: 720px; top: 840px; text-align: center; }
  #follow span { display: inline-block; padding: 12px 30px; border-radius: 999px; background: #2F6BFF; color: #fff;
    font-family: var(--kit-font-body); font-weight: 800; font-size: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="720" height="1280"></canvas>
  <div class="layer" id="room"><div id="roomInner"></div></div>
  <div class="layer" id="overlay">
    <div id="title"></div>
    <div id="place"></div>
    <div id="counter"></div>
    <div id="follow"></div>
    <div id="captions"></div>
  </div>
</div>
<script id="vs" type="x-shader/x-vertex">
attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform float uSceneA;   // 0 ice, 1 savanna, 2 ocean, 3 globe, 4 room
uniform float uSceneB;
uniform float uMix;      // 0 shows scene A, 1 shows scene B
uniform vec3 uCamA;      // ground: x, y, height. globe: distance, lat, lon. room: forward offset
uniform vec3 uCamB;
uniform vec2 uRotA;      // pitch, yaw (radians)
uniform vec2 uRotB;
uniform vec4 uObj[12];   // x, y, size, ring (0..1): stains, elephants, whales
uniform float uSat;      // satellite prop strength in the room (0 = none)
uniform float uSatYaw;
uniform vec3 uRing;      // ring colour
uniform vec3 uFog;       // haze colour

float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float hash3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec2 p) {
  vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float noise3(vec3 x) {
  vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1,0,0)), f.x), mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), f.x), mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec2 p) { float v = 0.0; float a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; } return v; }
float fbm3(vec3 p) { float v = 0.0; float a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise3(p); p = p * 2.02 + 11.3; a *= 0.5; } return v; }
// Distance to the nearest cell edge (cracks and leads in the ice).
float cellEdge(vec2 p) {
  vec2 i = floor(p); vec2 f = fract(p); float d1 = 8.0; float d2 = 8.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(float(x), float(y)); vec2 o = vec2(hash(i + g), hash(i + g + 7.7));
    float d = length(g + o - f); if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
  }
  return d2 - d1;
}
float ring(vec2 P, vec2 c, float r, float px) {
  float d = abs(length(P - c) - r);
  return smoothstep(2.2 * px, 0.6 * px, d) + 0.35 * smoothstep(9.0 * px, 0.0, d);
}

vec3 iceAt(vec2 P, float px) {
  float n = fbm(P * 0.004);
  vec3 c = mix(vec3(0.80, 0.86, 0.90), vec3(0.95, 0.97, 0.99), n);
  c *= 0.96 + 0.06 * noise(P * 0.25);
  float ridge = abs(fbm(P * 0.012 + 3.0) - 0.5);
  c *= 0.93 + 0.07 * smoothstep(0.0, 0.06, ridge);
  vec2 W = P + (vec2(fbm(P * 0.01), fbm(P * 0.01 + 5.0)) - 0.5) * 60.0;
  float e = cellEdge(W * 0.0022);
  float lead = smoothstep(0.011, 0.004, e) * smoothstep(0.3, 0.5, fbm(P * 0.003 + 9.0));
  c = mix(c, vec3(0.16, 0.28, 0.37), lead * 0.85);
  float glow = 0.0;
  for (int i = 0; i < 12; i++) {
    vec4 o = uObj[i];
    if (o.z <= 0.0) continue;
    vec2 d = P - o.xy;
    float warp = (fbm(P * 0.03 + float(i) * 3.1) - 0.5) * o.z * 0.9;
    float m = smoothstep(o.z, o.z * 0.45, length(d) + warp);
    vec3 stain = mix(vec3(0.55, 0.42, 0.30), vec3(0.42, 0.31, 0.22), noise(P * 0.08));
    c = mix(c, stain, m * 0.9);
    vec2 cell = floor(P / 2.6); vec2 off = vec2(hash(cell), hash(cell + 3.3)) * 1.6 + 0.5;
    float dot1 = smoothstep(0.75, 0.45, length(P - cell * 2.6 - off)) * step(0.35, hash(cell + 1.7));
    c = mix(c, vec3(0.08, 0.08, 0.09), dot1 * smoothstep(0.55, 0.85, m) * smoothstep(0.6, 0.15, px));
    glow += o.w * ring(P, o.xy, o.z * 1.35, px);
  }
  return mix(c, uRing, clamp(glow, 0.0, 1.0));
}

vec3 savannaAt(vec2 P, float px) {
  float n = fbm(P * 0.006);
  vec3 c = mix(vec3(0.62, 0.57, 0.36), vec3(0.75, 0.68, 0.45), n);
  c = mix(c, vec3(0.47, 0.48, 0.27), smoothstep(0.55, 0.75, fbm(P * 0.01 + 4.0)));
  float track = abs(fbm(P * 0.004 + 1.3) - 0.5);
  c = mix(c, vec3(0.80, 0.70, 0.52), smoothstep(0.012, 0.004, track));
  float hole = length(P - vec2(40.0, 10.0)) + (fbm(P * 0.02) - 0.5) * 50.0;
  c = mix(c, vec3(0.50, 0.45, 0.33), smoothstep(95.0, 80.0, hole));
  c = mix(c, vec3(0.20, 0.33, 0.35), smoothstep(70.0, 62.0, hole));
  vec2 cell = floor(P / 14.0); vec2 tp = cell * 14.0 + vec2(hash(cell), hash(cell + 5.1)) * 14.0;
  float has = step(0.72, hash(cell + 2.2)) * step(95.0, hole);
  float tr = 2.5 + 2.5 * hash(cell + 9.0);
  c = mix(c, c * 0.55, has * smoothstep(tr, tr * 0.6, length(P - tp - vec2(1.6, -1.6))));
  c = mix(c, vec3(0.20, 0.29, 0.14) * (0.8 + 0.4 * noise(P * 0.8)), has * smoothstep(tr, tr * 0.7, length(P - tp)));
  float glow = 0.0;
  for (int i = 0; i < 12; i++) {
    vec4 o = uObj[i];
    if (o.z <= 0.0) continue;
    float a = hash(vec2(float(i), 4.0)) * 6.283;
    mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
    vec2 q = R * (P - o.xy);
    vec2 qs = R * (P - o.xy - vec2(0.9, -0.9) * o.z * 0.25);
    float sh = smoothstep(1.0, 0.8, length(qs / vec2(o.z, o.z * 0.6)));
    c = mix(c, c * 0.5, sh * 0.8);
    float body = length(q / vec2(o.z, o.z * 0.6));
    float head = length((q - vec2(o.z * 0.95, 0.0)) / vec2(o.z * 0.35, o.z * 0.3));
    float m = max(smoothstep(1.0, 0.85, body), smoothstep(1.0, 0.8, head));
    vec3 hide = mix(vec3(0.38, 0.36, 0.35), vec3(0.55, 0.53, 0.51), smoothstep(0.9, 0.0, body));
    c = mix(c, hide, m);
    glow += o.w * ring(P, o.xy, o.z * 1.9, px);
  }
  return mix(c, uRing, clamp(glow, 0.0, 1.0));
}

vec3 oceanAt(vec2 P, float px) {
  float n = fbm(P * 0.002);
  vec3 c = mix(vec3(0.03, 0.17, 0.27), vec3(0.06, 0.27, 0.38), n);
  float w = fbm(P * 0.05 + vec2(uTime * 0.3, 0.0));
  c += 0.04 * vec3(0.6, 0.8, 0.9) * (w - 0.5);
  float cap = step(0.985, noise(P * 0.35 + uTime * 0.2)) * smoothstep(0.5, 0.8, fbm(P * 0.01));
  c = mix(c, vec3(0.85, 0.92, 0.95), cap * 0.6);
  float glow = 0.0;
  for (int i = 0; i < 12; i++) {
    vec4 o = uObj[i];
    if (o.z <= 0.0) continue;
    float a = hash(vec2(float(i), 8.0)) * 6.283;
    mat2 R = mat2(cos(a), -sin(a), sin(a), cos(a));
    vec2 q = R * (P - o.xy);
    float taper = mix(0.32, 0.12, smoothstep(-o.z, o.z, q.x));
    float body = length(q / vec2(o.z, o.z * taper));
    float tail = length((q + vec2(o.z * 1.05, 0.0)) / vec2(o.z * 0.12, o.z * 0.3));
    float wash = smoothstep(1.6, 1.0, length(q / vec2(o.z * 1.2, o.z * 0.5)));
    c = mix(c, vec3(0.55, 0.72, 0.78), wash * 0.35);
    float m = max(smoothstep(1.0, 0.8, body), smoothstep(1.0, 0.7, tail));
    c = mix(c, vec3(0.11, 0.15, 0.18), m);
    glow += o.w * ring(P, o.xy, o.z * 1.8, px);
  }
  return mix(c, uRing, clamp(glow, 0.0, 1.0));
}

vec3 groundView(float scene, vec3 cam, vec2 rot, vec2 uv) {
  vec3 d = normalize(vec3(uv, -1.0));
  float cp = cos(rot.x); float sp = sin(rot.x);
  d = vec3(d.x, d.y * cp - d.z * sp, d.y * sp + d.z * cp);
  float cy = cos(rot.y); float sy = sin(rot.y);
  d = vec3(d.x * cy - d.y * sy, d.x * sy + d.y * cy, d.z);
  if (d.z > -0.02) return uFog;
  float t = cam.z / -d.z;
  vec2 P = cam.xy + d.xy * t;
  float px = t / uRes.y * 1.1;
  vec3 c;
  if (scene < 0.5) c = iceAt(P, px);
  else if (scene < 1.5) c = savannaAt(P, px);
  else c = oceanAt(P, px);
  float fog = 1.0 - exp(-max(t - cam.z, 0.0) * 0.0004);
  return mix(c, uFog, clamp(fog, 0.0, 0.85));
}

vec3 globeView(vec3 cam, vec2 uv) {
  float dist = cam.x; float lat = cam.y; float lon = cam.z;
  vec3 target = vec3(cos(lat) * cos(lon), sin(lat), cos(lat) * sin(lon));
  vec3 ro = target * dist;
  vec3 fw = -target; vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0))); vec3 up = cross(rt, fw);
  vec3 rd = normalize(fw + uv.x * rt * 0.9 + uv.y * up * 0.9);
  float b = dot(ro, rd); float cc = dot(ro, ro) - 1.0; float h = b * b - cc;
  vec3 L = normalize(target + rt * 0.6 + up * 0.5);
  vec3 bg = vec3(0.0) + vec3(step(0.997, hash(floor(uv * 400.0)))) * 0.8;
  float rim = 0.0;
  if (h < 0.0) {
    float closest = length(ro - rd * b) - 1.0;
    rim = exp(-max(closest, 0.0) * 30.0);
    return bg + vec3(0.25, 0.5, 0.95) * rim * 0.7;
  }
  float t = -b - sqrt(h);
  vec3 n = normalize(ro + rd * t);
  float land = smoothstep(0.52, 0.56, fbm3(n * 2.2 + 3.0));
  vec3 c = mix(vec3(0.02, 0.10, 0.22), mix(vec3(0.22, 0.32, 0.17), vec3(0.50, 0.44, 0.30), fbm3(n * 6.0)), land);
  c = mix(c, vec3(0.92, 0.95, 0.98), smoothstep(-0.78, -0.86, n.y));
  float cloud = smoothstep(0.55, 0.75, fbm3(n * 4.0 + vec3(uTime * 0.02, 0.0, 0.0)));
  c = mix(c, vec3(1.0), cloud * 0.8);
  float lit = clamp(dot(n, L) * 1.1 + 0.15, 0.0, 1.0);
  c *= lit;
  float fres = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
  return c + vec3(0.3, 0.55, 1.0) * fres * 0.6;
}

// The room: ceiling light strips over a dark floor, and an optional satellite prop.
float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
float satMap(vec3 p, out float mat) {
  float c = cos(uSatYaw); float s = sin(uSatYaw);
  p.xz = mat2(c, -s, s, c) * p.xz;
  float body = sdBox(p, vec3(0.24, 0.3, 0.24)) - 0.03;
  float panels = sdBox(vec3(abs(p.x) - 1.05, p.y, p.z), vec3(0.7, 0.3, 0.012));
  float arm = sdBox(vec3(abs(p.x) - 0.3, p.y, p.z), vec3(0.08, 0.02, 0.02));
  float dish = length(p - vec3(0.0, -0.42, 0.0)) - 0.13;
  float d = min(min(body, panels), min(arm, dish));
  mat = body < panels && body < dish ? 1.0 : (panels < dish ? 2.0 : 3.0);
  return d;
}
vec3 roomView(vec3 cam, vec2 uv) {
  vec3 rd = normalize(vec3(uv.x, uv.y - 0.05, 1.3));
  vec3 c = mix(vec3(0.0, 0.0, 0.06), vec3(0.0, 0.01, 0.03), clamp(uv.y + 0.5, 0.0, 1.0));
  if (rd.y > 0.0) {
    float t = 2.4 / rd.y; vec3 P = rd * t; P.z += cam.x;
    float strip = step(abs(P.x), 0.4) * step(fract(P.z / 2.6), 0.22);
    c += vec3(0.9, 0.94, 0.98) * strip * exp(-t * 0.06);
  } else {
    float t = 1.7 / -rd.y; vec3 P = rd * t; P.z += cam.x;
    float strip = step(abs(P.x), 0.4) * step(fract(P.z / 2.6), 0.22);
    c += vec3(0.5, 0.6, 0.7) * strip * 0.05 * exp(-t * 0.1);
  }
  if (uSat > 0.0) {
    vec3 ro = vec3(0.0, 0.1, -7.5 + cam.y);
    vec3 rr = normalize(vec3(uv.x, uv.y, 1.6));
    float t = 0.0; float mat = 0.0; float hit = 0.0;
    for (int i = 0; i < 70; i++) {
      float d = satMap(ro + rr * t, mat);
      if (d < 0.002) { hit = 1.0; break; }
      t += d; if (t > 12.0) break;
    }
    if (hit > 0.5) {
      vec3 p = ro + rr * t; vec2 e = vec2(0.002, 0.0); float m2;
      vec3 n = normalize(vec3(satMap(p + e.xyy, m2) - satMap(p - e.xyy, m2), satMap(p + e.yxy, m2) - satMap(p - e.yxy, m2),
        satMap(p + e.yyx, m2) - satMap(p - e.yyx, m2)));
      vec3 base = mat < 1.5 ? vec3(0.80, 0.62, 0.25) : (mat < 2.5 ? vec3(0.08, 0.14, 0.30) : vec3(0.85));
      if (mat > 1.5 && mat < 2.5) {
        vec3 q = p; float cs = cos(uSatYaw); float sn = sin(uSatYaw); q.xz = mat2(cs, -sn, sn, cs) * q.xz;
        float grid = step(0.9, fract(q.x * 6.0)) + step(0.88, fract(q.y * 6.0));
        base = mix(base, vec3(0.5, 0.65, 0.8), clamp(grid, 0.0, 1.0) * 0.5);
      }
      vec3 Lk = normalize(vec3(-0.5, 0.8, -0.6));
      float dif = max(dot(n, Lk), 0.0);
      float rimL = pow(1.0 - max(dot(n, -rr), 0.0), 3.0);
      vec3 h2 = normalize(Lk - rr); float spec = pow(max(dot(n, h2), 0.0), 40.0);
      vec3 sc = base * (0.15 + 0.9 * dif) + vec3(1.0) * spec * 0.6 + uRing * rimL * 0.6;
      c = mix(c, sc, uSat);
    }
  }
  return c;
}

vec3 view(float scene, vec3 cam, vec2 rot, vec2 uv) {
  if (scene < 2.5) return groundView(scene, cam, rot, uv);
  if (scene < 3.5) return globeView(cam, uv);
  return roomView(cam, uv);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 c = view(uSceneA, uCamA, uRotA, uv);
  if (uMix > 0.0) c = mix(c, view(uSceneB, uCamB, uRotB, uv), uMix);
  float vig = 1.0 - 0.35 * dot(uv * vec2(1.2, 0.9), uv * vec2(1.2, 0.9));
  c *= vig;
  c = pow(c, vec3(0.95));
  gl_FragColor = vec4(c, 1.0);
}
</script>
<script src="./show.js"></script>
</body>
</html>
